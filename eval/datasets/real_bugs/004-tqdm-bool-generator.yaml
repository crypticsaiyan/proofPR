text: |
  bool() on a tqdm wrapping a generator blows up:

  In [28]: bool(tqdm.tqdm((1 for i in range(10))))
  TypeError: 'NoneType' object cannot be interpreted as an integer

  tqdm 4.29.1, python 3.6.6, linux. Would expect this to mirror whatever
  bool(self.iterable) gives instead of raising.
