text: |
  Wrapping a multiprocessing Pool.imap in tqdm with disable=True blows up:

      from tqdm import tqdm
      from multiprocessing import Pool

      def f(arg):
          pass

      if __name__ == '__main__':
          pool = Pool()
          list(tqdm(pool.imap(f, range(100)), disable=True))

  AttributeError: 'tqdm' object has no attribute 'total'

  Removing disable=True (or setting it to False) makes it work fine.

  tqdm 4.22.0, python 3.6.0, Win64
intent: bug
in_scope: true
reproducible: true
expected_outcome: pr_opened
