  https://github.com/cookiecutter/cookiecutter/pull/1414. Hidden maintainer
  test: eval/datasets/real_bugs/hidden/real-013.py, the whole (171-line,
  self-contained) tests/test_generate_context.py at the fixed commit; its
  fixture JSON files already live in that repo's tests/ directory.
