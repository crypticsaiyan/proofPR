text: |
  Running cookiecutter on Windows, the default values shown at the prompts
  (and the values written into generated files, e.g. LICENSE) come out
  mangled for anything non-ascii, an author name in particular. Same
  template works fine on Linux. Looks like the context JSON gets opened with
  whatever the platform's default encoding is instead of utf-8.
intent: bug
