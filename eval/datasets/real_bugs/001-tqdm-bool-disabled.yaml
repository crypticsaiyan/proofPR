text: |
  bool(pbar) blows up when the bar was made with disable=True:

  In [3]: pbar = tqdm(disable=False, total=100)
  In [4]: bool(pbar)
  Out[4]: True

  In [5]: pbar = tqdm(disable=True, total=100)
  In [6]: bool(pbar)
  AttributeError: 'tqdm' object has no attribute 'total'

  Works fine with disable=False. I'd expect the disabled case to just
  evaluate to False, not blow up.

  tqdm 4.23.4, python 3.5.2, linux
intent: bug
