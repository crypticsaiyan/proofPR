text: |
  A request that fails a condecimal constraint returns a 500 instead of a
  422: the server log shows a raw TypeError, not a validation-error
  response.

  Plain pydantic raises a normal ValidationError for the same input outside
  of FastAPI, so this looks specific to how FastAPI serializes the error
  detail for this kind of constraint.
