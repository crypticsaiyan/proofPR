text: |
  HTTPBearer(auto_error=False) still raises a 403 if the Authorization
  header uses the wrong scheme (Basic instead of Bearer). auto_error=False
  is supposed to mean "never raise automatically, hand me None so I can
  handle it myself" - that only actually works for a missing header today,
  not a wrong-scheme one.
intent: bug
in_scope: true
