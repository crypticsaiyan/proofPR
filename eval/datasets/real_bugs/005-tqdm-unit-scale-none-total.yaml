text: |
  Passing unit_scale over an iterable with no known length blows up:

      for i in tqdm((i for i in range(10)), unit_scale=10):
          pass

  TypeError: unsupported operand type(s) for *=: 'NoneType' and 'int'

  Works fine without unit_scale, and works fine with unit_scale over a list
  (which has a known length).
